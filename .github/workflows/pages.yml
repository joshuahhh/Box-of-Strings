# Builds the browser version of Box of Strings (see web/README.md) and
# publishes it to GitHub Pages on every push to main. Pull requests are
# built (to catch breakage) but not published.
name: Web version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Emscripten (used by GHC's JS backend when linking) otherwise rebuilds
      # its C libraries on every run, and GHC only recompiles changed modules
      # when its build directory is kept.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/emscripten-cache
            web/.build
          key: web-build-${{ hashFiles('web/shell.nix') }}-${{ hashFiles('app/**/*.hs', 'web/gloss/**/*.hs') }}
          restore-keys: web-build-${{ hashFiles('web/shell.nix') }}-
      - name: Build
        env:
          EM_CACHE: ${{ runner.temp }}/emscripten-cache
        run: nix-shell web/shell.nix --run web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
